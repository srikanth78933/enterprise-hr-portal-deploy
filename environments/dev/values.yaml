# ===============================================================
# DEV overrides (applied on top of helm/enterprise-hr-portal/values.yaml)
# Environment variables for dev are in config/env-dev.yaml
# ===============================================================

# Secrets Manager secret for dev (JSON with "username" and "password")
secrets:
  awsSecretName: "enterprise-hr-portal/dev/db"

# IAM role (IRSA) allowed to read the dev secret
# (infra repo: terraform output app_irsa_role_arn)
serviceAccount:
  roleArn: "arn:aws:iam::476079000065:role/enterprise-hr-portal-dev-secrets-role"

# Smaller footprint for dev
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

# A PDB with a single pod would block node drains, so it is off in dev
podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
