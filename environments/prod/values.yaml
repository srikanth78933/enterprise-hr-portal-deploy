# ===============================================================
# PROD overrides (applied on top of helm/enterprise-hr-portal/values.yaml)
# Environment variables for prod are in config/env-prod.yaml
# ===============================================================

# Secrets Manager secret for prod (JSON with "username" and "password")
secrets:
  awsSecretName: "enterprise-hr-portal/prod/db"

# IAM role (IRSA) allowed to read the prod secret
# (infra repo: terraform output app_irsa_role_arn)
serviceAccount:
  roleArn: "arn:aws:iam::476079000065:role/enterprise-hr-portal-prod-secrets-role"

# Always at least 3 pods in prod; the HPA scales up to 6 under load
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 1Gi

# ALB settings for prod
ingress:
  # infra repo "terraform output waf_web_acl_arn" (the ARN changes each time prod is recreated; empty = no WAF)
  wafAclArn: ""
  # Optional: ACM certificate ARN to enable HTTPS (443) with an 80 -> 443 redirect
  certificateArn: ""
