# ===============================================================
# DEV environment variables -> ConfigMap (non-sensitive values only!)
# Keys here add to / override "env" in helm/enterprise-hr-portal/values.yaml.
# Passwords and other secrets belong in AWS Secrets Manager, not here.
# ===============================================================
env:
  # CHANGE ME: dev RDS endpoint
  DB_HOST: "enterprise-hr-dev.xxxxxxxxxxxx.us-east-1.rds.amazonaws.com"
  DB_NAME: "employee_db"
  DB_SSL_MODE: "require"
  # More detailed application logs in dev (Spring maps this to logging.level.com.example.employee)
  LOGGING_LEVEL_COM_EXAMPLE_EMPLOYEE: "DEBUG"
