# The IAM role in the annotation (IRSA) allows the pods to read the secret from AWS Secrets Manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "enterprise-hr-portal.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
