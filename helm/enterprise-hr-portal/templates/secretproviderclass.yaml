# Reads the database credentials from AWS Secrets Manager.
# The CSI driver mounts them into the pod and also syncs them into the
# Kubernetes Secret "<release>-db", which the Deployment uses for env variables.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-aws-secrets
  labels:
    {{- include "enterprise-hr-portal.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsSecretsManager.region | quote }}
    objects: |
      - objectName: {{ .Values.awsSecretsManager.secretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db-username"
          - path: "password"
            objectAlias: "db-password"
  secretObjects:
    - secretName: {{ .Release.Name }}-db
      type: Opaque
      labels:
        {{- include "enterprise-hr-portal.labels" . | nindent 8 }}
      data:
        - objectName: db-username
          key: DB_USERNAME
        - objectName: db-password
          key: DB_PASSWORD
