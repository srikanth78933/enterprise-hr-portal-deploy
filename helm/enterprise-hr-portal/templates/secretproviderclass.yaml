# Reads the keys listed in .Values.secrets.keys from one AWS Secrets Manager secret.
# The CSI driver mounts them into the pod and also syncs them into the
# Kubernetes Secret "<release>-secrets", which the Deployment uses for env variables.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-aws-secrets
  labels:
    {{- include "enterprise-hr-portal.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required "secrets.awsSecretName is required: set it in environments/<env>/values.yaml" .Values.secrets.awsSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          {{- range $envName, $jsonKey := .Values.secrets.keys }}
          - path: {{ $jsonKey | quote }}
            objectAlias: {{ $envName | quote }}
          {{- end }}
  secretObjects:
    - secretName: {{ .Release.Name }}-secrets
      type: Opaque
      labels:
        {{- include "enterprise-hr-portal.labels" . | nindent 8 }}
      data:
        {{- range $envName, $jsonKey := .Values.secrets.keys }}
        - objectName: {{ $envName }}
          key: {{ $envName }}
        {{- end }}
