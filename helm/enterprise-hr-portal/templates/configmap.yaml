# All keys from .Values.env (global values.yaml + config/env-<env>.yaml) become environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "enterprise-hr-portal.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.containerPort | quote }}
  DB_HOST: {{ required "env.DB_HOST is required: set it in config/env-<env>.yaml" .Values.env.DB_HOST | quote }}
  {{- range $key, $value := .Values.env }}
  {{- if ne $key "DB_HOST" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
