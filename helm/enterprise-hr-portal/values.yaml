# ===============================================================
# GLOBAL DEFAULTS for all environments.
# Environment overrides (applied on top of this file, later files win):
#   environments/<env>/values.yaml   replicas, HPA, resources, secret name, IAM role ...
#   config/env-<env>.yaml            environment variables (ConfigMap)
# ===============================================================

# Image (Jenkins sets image.repository and image.tag on every deploy)
image:
  repository: devopstraining064/enterprise-hr-portal
  tag: "latest"
  pullPolicy: IfNotPresent

# Used only when autoscaling.enabled is false
replicaCount: 2

# Port the Spring Boot application listens on inside the container
containerPort: 8080

# ---------------------------------------------------------------
# Environment variables -> ConfigMap (non-sensitive values only).
# Every key here becomes an environment variable in the pods.
# config/env-<env>.yaml adds or overrides keys (DB_HOST is required there).
# ---------------------------------------------------------------
env:
  DB_PORT: "5432"
  DB_NAME: "employee_db"
  DB_SSL_MODE: "require"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

# ---------------------------------------------------------------
# Secrets from AWS Secrets Manager (read by the Secrets Store CSI driver).
# Only the secret NAME and KEY NAMES are configured here, never the values.
#   awsSecretName: Secrets Manager secret (JSON), set per environment
#   keys:          <ENV_VARIABLE>: <json key inside the secret>
# ---------------------------------------------------------------
secrets:
  awsSecretName: ""
  # Jenkins sets this from AWS_REGION
  region: "us-east-1"
  keys:
    DB_USERNAME: username
    DB_PASSWORD: password

# ServiceAccount linked to an IAM role (IRSA) that can read the secret above.
# roleArn is set per environment.
serviceAccount:
  roleArn: ""

# Service. LoadBalancer creates an AWS load balancer; use ClusterIP with the Ingress.
service:
  type: LoadBalancer
  port: 80

# Ingress (optional). Requires the AWS Load Balancer Controller in the cluster.
ingress:
  enabled: false
  className: alb
  # Leave empty to accept any host name
  host: ""

# HorizontalPodAutoscaler (requires metrics-server in the cluster)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget: keep at least this many pods during node drains/upgrades
podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
